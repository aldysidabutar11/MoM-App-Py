# ===========================================================================
# MoM-IGD default configuration  (tracked in Git)
#
# Do not put machine-specific values or secrets here. For per-machine
# overrides create `config/local.toml` (git-ignored) or set MOM_IGD_* environment
# variables. Precedence, lowest to highest:
#
#   default.toml  <  local.toml  <  MOM_IGD_* env vars  <  CLI flags
#
# Every setting below is validated on load. Invalid values abort startup with an
# explicit message rather than being silently corrected.
# ===========================================================================

# Configuration schema version. A build refuses to load a schema it does not
# understand instead of guessing.
#   1 = Phase 1 foundation
#   2 = Phase 2 adds the [audio] section below
#   3 = Phase 3 corrective adds [participants] (roster capacity + safety ceiling)
#
# A `local.toml` that omits this key, or omits [participants] entirely, keeps
# working: every key in that section has a default, so the bump resets nothing an
# operator has already configured.
config_schema_version = 3

# Runtime mode. Only "offline" is supported: there is no cloud or hybrid mode
# and no cloud fallback (ADR-0002).
runtime_mode = "offline"

# Offline invariant. Rejected if set to false.
offline = true

# DEBUG | INFO | WARNING | ERROR | CRITICAL
log_level = "INFO"

# ---------------------------------------------------------------------------
# Runtime data root (ADR-0003)
#
# All recordings, databases, exports, logs, model binaries, temp files and
# backups live under this directory, which must be OUTSIDE the repository.
# Override with the MOM_IGD_DATA_DIR environment variable or in local.toml.
# ---------------------------------------------------------------------------
data_root = 'D:\MoM-IGD-Data'

# Model registry declaration. Relative paths resolve against the repository
# root. The registry (a small JSON file) is tracked in Git; the model BINARIES
# it describes live under <data_root>/models and are never committed.
model_registry_path = 'models/registry.json'

# ---------------------------------------------------------------------------
# Local HTTP API
#
# host is fixed to loopback. Any wildcard, LAN or public address is rejected by
# configuration validation, not merely discouraged.
# port_strategy:
#   "ephemeral" - bind port 0 and let the OS pick a free port (default; a
#                 single-device desktop app has no reason to claim a fixed port
#                 and this removes port-conflict failures entirely)
#   "fixed"     - bind the `port` below
# ---------------------------------------------------------------------------
[api]
host = "127.0.0.1"
port = 8765
port_strategy = "ephemeral"
# OpenAPI/Swagger is served only over loopback and is additionally protected by
# a Host-header allowlist that blocks DNS-rebinding attempts.
docs_enabled = true
startup_timeout_s = 15.0
shutdown_timeout_s = 10.0

# ---------------------------------------------------------------------------
# Resource guardrails (ADR-0004)
#
# Target device: Intel Core i7-1260P, 16 GB RAM, Intel Iris Xe.
# Phase 0 measured only ~4.1 GB free RAM under a normal desktop session, so at
# most one heavy model may be resident at any moment. Values above 1 are
# rejected.
# ---------------------------------------------------------------------------
[resources]
max_heavy_workers = 1
# Warning threshold only: the doctor reports WARN below this, it does not fail.
min_free_ram_mb = 2048
# Warning threshold for free space on the runtime data volume.
min_free_disk_gb = 10

# ---------------------------------------------------------------------------
# SQLite (ADR-0003)
#
# WAL mode and foreign-key enforcement are verified on every connection; a
# database that does not report them is treated as an error, not a warning.
# ---------------------------------------------------------------------------
[database]
filename = "mom_igd.db"
busy_timeout_ms = 5000

# ---------------------------------------------------------------------------
# Desktop shell (pywebview + WebView2)
# ---------------------------------------------------------------------------
[ui]
startup_timeout_s = 20.0
window_width = 1180
window_height = 780

# ---------------------------------------------------------------------------
# Offline audio capture (Phase 2)
#
# `preferred_device_fingerprint` is deliberately EMPTY here. A fingerprint
# identifies one physical microphone on one machine, so committing one would make
# every other machine start with a selection it cannot resolve. Put it in
# `config/local.toml`, or let an explicit device selection store it.
#
# Storage, uncompressed PCM16 (decimal MB):
#   48 kHz mono   ~= 345.6 MB/h
#   48 kHz stereo ~= 691.2 MB/h
# ---------------------------------------------------------------------------
[audio]
preferred_device_fingerprint = ""
# Unset means "use the device's native rate", which avoids resampling entirely.
# preferred_sample_rate = 48000
max_channels = 2
sample_format = "int16"

# Chunk length. Shorter loses less to a crash but multiplies file count; longer
# risks the 4 GiB WAV limit and loses more when a file is damaged.
chunk_seconds = 30

# Bounded hand-off between the audio callback and the writer thread. About five
# seconds of headroom absorbs a disk hiccup; anything beyond it is counted as lost
# audio rather than buffered without limit.
queue_seconds = 5.0
writer_shutdown_timeout_s = 15.0

# Disk safety. Recording refuses to start below min_free_disk_gb and finalises
# cleanly if free space falls below low_disk_abort_gb while running.
min_free_disk_gb = 5.0
low_disk_abort_gb = 1.0

# Microphone test length, 10-15 s.
calibration_seconds = 12

# Level judgement thresholds (dBFS). Must satisfy
# silence < too_quiet < too_loud_peak.
silence_dbfs_threshold = -60.0
too_quiet_dbfs = -45.0
too_loud_peak_dbfs = -1.0
clipping_percent_threshold = 0.01

# UI polling. 2-4 Hz is enough for a level meter and keeps the API cheap.
status_poll_hz = 3.0
# 1 = exact RMS. Raise it to trade a little accuracy for CPU on the live meter.
meter_stride = 1

auto_recover_on_start = true
quarantine_ambiguous_partials = true
# Production acceptance requires a USB conference microphone verified by Windows;
# the built-in array is development only.
production_requires_usb = true

# ---------------------------------------------------------------------------
# AI providers
#
# STILL EMPTY BY DESIGN IN PHASE 2. No ASR, diarization, speaker-embedding or
# LLM provider has been selected; the choice is deferred to the Phase 4A
# benchmark (ADR-0005). Audio capture needs no provider, so an empty block here
# is the correct state for this build, not an oversight.
#
# When entries are added they must be either:
#   * an absolute filesystem path, or a path containing a separator
#     (resolved against <data_root>/models), or
#   * a loopback URL: http://127.0.0.1:PORT, http://localhost:PORT, http://[::1]:PORT
#
# Any other host - including every hosted inference API - is rejected by
# configuration validation.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Meeting roster capacity.
#
# `default_meeting_participant_capacity` is the capacity a NEW meeting starts
# with. Nine is the backward-compatible default - the number the original
# diarization sizing assumed - not a limit of the product. Every meeting that
# existed before migration 0004 was given 9, so behaviour is unchanged.
#
# The value actually in force is stored PER MEETING in the database, so changing
# this default never retunes a meeting created before the change. An operator
# changes one meeting's capacity from the participant panel.
#
# `maximum_meeting_participant_capacity` is a safety ceiling: it stops a typo
# turning one meeting into a thousand-row roster. It is NOT a claim that this
# many speakers can be told apart. Real speaker recognition needs an approved
# embedding model, a USB conference microphone and acceptance testing in the
# actual room - none of which exist yet. Raising this number does not improve
# accuracy, and the application never describes any roster as "unlimited".
#
# Neither value decides whether audio is recorded. Capture always takes the
# whole room signal; the roster only decides who the KNOWN speaker candidates
# are. A voice with no voiceprint, or one belonging to nobody on the roster,
# becomes UNKNOWN from Phase 6 onwards - it is never discarded.
#
# The participant DIRECTORY has no size limit at all. It holds everyone ever
# registered, and removing somebody from a roster does not remove them from it.
# ---------------------------------------------------------------------------
[participants]
default_meeting_participant_capacity = 9
maximum_meeting_participant_capacity = 50

[providers]

[providers.endpoints]
# Examples (commented out; no phase up to and including 2 selects anything):
# asr = 'D:\MoM-IGD-Data\models\asr\model.bin'
# llm = "http://127.0.0.1:8080"
